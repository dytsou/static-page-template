name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Verify deploy contract shape
        run: |
          node --input-type=module -e "
            import { readFileSync, existsSync } from 'node:fs';
            const c = JSON.parse(readFileSync('deploy-contract.json', 'utf8'));
            if (!existsSync('dist/index.html')) throw new Error('missing dist/index.html');
            if (!/^dy-tsou-[a-z0-9-]+$/.test(c.pagesProject)) throw new Error('pagesProject');
            if (c.outputDir !== 'dist') throw new Error('outputDir');
            if (c.basePath !== '/') throw new Error('basePath');
            console.log('verify-deploy-contract: ok (shape)');
          "

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error
